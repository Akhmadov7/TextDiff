{% extends "base.html" %}
{% block title %}Новая задача — TextDiff{% endblock %}
{% block h1 %}Новая задача — TextDiff{% endblock %}
{% block content %}
<div class="card">
  <p>Загрузите CSV с колонками текста и группы.</p>

  </form>
</div>
{% endblock %}
