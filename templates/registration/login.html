{% extends "base.html" %}
{% block title %}Вход — TextDiff{% endblock %}
{% block h1 %}Вход{% endblock %}
{% block content %}
<div class="card">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Войти</button>
  </form>
  {% if form.errors %}<p class="status-failed">Неверный логин или пароль.</p>{% endif %}
</div>
{% endblock %}
